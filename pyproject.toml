[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markitdown-desktop"
version = "1.0.0"
description = "A polished macOS desktop interface for Microsoft MarkItDown"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MarkItDown Desktop Contributors" }]

dependencies = [
    "markitdown[all]>=0.1.0",
    "PySide6>=6.7.0",
    "markdown>=3.7",
    "Pygments>=2.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-mock>=3.14",
    "black>=24.0",
    "ruff>=0.4",
]
build = [
    "pyinstaller>=6.9",
    "pyinstaller-hooks-contrib>=2024.9",
]

[project.scripts]
markitdown-desktop = "app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
