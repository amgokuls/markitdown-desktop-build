name: Build Windows App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PySide6 markitdown pillow pyinstaller

    - name: Build with PyInstaller (OneFile)
      run: |
        pyinstaller --noconfirm --clean --onefile --windowed --name "MarkItDown Desktop" --icon "resources\icons\AppIcon.ico" --add-data "resources;resources" --hidden-import "markitdown" --hidden-import "PySide6.QtWebEngineCore" app\main.py

    - name: Upload Windows Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MarkItDown-Desktop-Windows-Standalone
        path: dist\MarkItDown Desktop.exe
