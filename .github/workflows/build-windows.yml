name: Build Windows Installer

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/base.txt -r requirements/build.txt
        pip install pillow pyinstaller

    - name: Build with PyInstaller (folder mode for NSIS)
      run: |
        pyinstaller `
          --noconfirm `
          --clean `
          --windowed `
          --name "MarkItDown Desktop" `
          --icon "resources\icons\AppIcon.ico" `
          --add-data "resources;resources" `
          --hidden-import "markitdown" `
          --hidden-import "PySide6.QtWebEngineCore" `
          --hidden-import "markdown" `
          --hidden-import "pygments" `
          --collect-data "magika" `
          --copy-metadata "magika" `
          --copy-metadata "markitdown" `
          app\main.py

    - name: Install NSIS
      run: choco install nsis -y --no-progress

    - name: Build NSIS Installer
      run: |
        $env:PATH += ";C:\Program Files (x86)\NSIS"
        cd installer
        makensis installer.nsi

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MarkItDown-Desktop-Windows-Installer
        path: installer\MarkItDown-Desktop-Setup.exe
